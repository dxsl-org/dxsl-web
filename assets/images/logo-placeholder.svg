<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" fill="none">
  <defs>
    <linearGradient id="dxslGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Geometric Symbol: Open Node / Nexus Core -->
  <g transform="translate(10, 10)">
    <!-- Outer Hex-Circuit ring -->
    <polygon points="30,5 55,18 55,42 30,55 5,42 5,18" 
             stroke="url(#dxslGrad)" stroke-width="2.5" fill="none" stroke-linejoin="round"
             filter="url(#neonGlow)"/>
    
    <!-- Inner Core Lattice -->
    <circle cx="30" cy="30" r="7" fill="url(#dxslGrad)"/>
    <line x1="30" y1="12" x2="30" y2="23" stroke="#00f0ff" stroke-width="2"/>
    <line x1="30" y1="37" x2="30" y2="48" stroke="#8b5cf6" stroke-width="2"/>
    <line x1="14" y1="21" x2="23" y2="26" stroke="#00f0ff" stroke-width="2"/>
    <line x1="37" y1="34" x2="46" y2="39" stroke="#8b5cf6" stroke-width="2"/>
    <line x1="46" y1="21" x2="37" y2="26" stroke="#3b82f6" stroke-width="2"/>
    <line x1="23" y1="34" x2="14" y2="39" stroke="#3b82f6" stroke-width="2"/>

    <circle cx="5" cy="18" r="2.5" fill="#00f0ff"/>
    <circle cx="55" cy="18" r="2.5" fill="#3b82f6"/>
    <circle cx="55" cy="42" r="2.5" fill="#8b5cf6"/>
    <circle cx="5" cy="42" r="2.5" fill="#00f0ff"/>
    <circle cx="30" cy="5" r="2.5" fill="#00f0ff"/>
    <circle cx="30" cy="55" r="2.5" fill="#8b5cf6"/>
  </g>

  <!-- Typography DXSL -->
  <text x="82" y="48" font-family="'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="36" font-weight="900" letter-spacing="3" fill="#ffffff">
    DX<tspan fill="url(#dxslGrad)">SL</tspan>
  </text>

  <!-- Tagline underneath -->
  <text x="84" y="64" font-family="'JetBrains Mono', 'Fira Code', monospace" 
        font-size="9" font-weight="600" letter-spacing="2.5" fill="#94a3b8">
    OPEN RESEARCH LAB
  </text>

  <!-- Subtle tech dot accents -->
  <circle cx="225" cy="38" r="2" fill="#00f0ff" opacity="0.9"/>
  <circle cx="218" cy="38" r="1.5" fill="#8b5cf6" opacity="0.6"/>
  <circle cx="211" cy="38" r="1" fill="#3b82f6" opacity="0.4"/>
</svg>
